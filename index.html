<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Alpha clash pro</title>
    <!-- daisy ui setup -->
    <link
      href="https://cdn.jsdelivr.net/npm/daisyui@5"
      rel="stylesheet"
      type="text/css"
    />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  </head>

  <body class="poppins-regular">
    <main
      class="bg-[#010313] min-h-screen bg-[url(images/background.png)] bg-no-repeat bg-center"
    >
      <!-- Home section: play  -->
      <section id="home-section"
        class="home items-center min-h-screen flex text-white justify-center item-center border"
      >
        <div class="flex flex-col items-center gap-y-8">
          <h1 class="text-8xl font-bold anton-regular uppercase">
            Alpha Clash Pro
          </h1>
          <p>Unleash Your Keyboard Kun g Fu: Press "Enter" to Play</p>
          <button onclick="playNow()" class="btn bg-white text-black" >Play Now</button>
        </div>
      </section>

      <!-- Playground -->
      <section id="play-ground" class="play-ground w-full justify-center hidden">
        <div
          class="h-full flex flex-col gap-y-16 pt-20 justify-center items-center"
        >
          <!-- plaground container screen -->
          <div
            class="bg-[#ffffffB3] border-[#010313CC] h-80 w-10/12 border-[15px] rounded-2xl mx-auto"
          >
            <div class="flex justify-center">
              <p
                class="bg-[#010313b2] w-5/12 px-6 pb-4 rounded-b-md text-white flex justify-center items-center"
              >
                Don't watch keyboard while playing....
              </p>
            </div>
            <div class="flex justify-center items-center w-full h-full">
              <p id="current-alphabet" class="text-8xl font-bold">Y</p>
            </div>
          </div>

          <!-- keyboard layout -->
          <div>
            <div class="my-1 flex w-full justify-center gap-1">
              <kbd id="q" class="kbd">q</kbd>
              <kbd id="w" class="kbd">w</kbd>
              <kbd id="e" class="kbd">e</kbd>
              <kbd id="r" class="kbd">r</kbd>
              <kbd id="t" class="kbd">t</kbd>
              <kbd id="y" class="kbd">y</kbd>
              <kbd id="u" class="kbd">u</kbd>
              <kbd id="i" class="kbd">i</kbd>
              <kbd id="o" class="kbd">o</kbd>
              <kbd id="p" class="kbd">p</kbd>
            </div>
            <div class="my-1 flex w-full justify-center gap-1">
              <kbd id="a" class="kbd">a</kbd>
              <kbd id="s" class="kbd">s</kbd>
              <kbd id="d" class="kbd">d</kbd>
              <kbd id="f" class="kbd">f</kbd>
              <kbd id="g" class="kbd">g</kbd>
              <kbd id="h" class="kbd">h</kbd>
              <kbd id="j" class="kbd">j</kbd>
              <kbd id="k" class="kbd">k</kbd>
              <kbd id="l" class="kbd">l</kbd>
            </div>
            <div class="my-1 flex w-full justify-center gap-1">
              <kbd id="z" class="kbd">z</kbd>
              <kbd id="x" class="kbd">x</kbd>
              <kbd id="c" class="kbd">c</kbd>
              <kbd id="v" class="kbd">v</kbd>
              <kbd id="b" class="kbd">b</kbd>
              <kbd id="n" class="kbd">n</kbd>
              <kbd id="m" class="kbd">m</kbd>
              <kbd id="/" class="kbd">/</kbd>
            </div>
          </div>

          <!-- button layout -->
          <div class="flex justify-between sm:w-11/12 md:w-8/12 items-center">
            <button class="btn bg-purple-700 px-4 text-white rounded-full">
              Life
              <img class="bg-blend-darken" src="images/Heart.svg" alt="" />
              <span>1</span>
            </button>
            <button class="btn bg-purple-700 px-4 text-white rounded-full">
              score
              <img src="images/dollar.svg" alt="" />
              <span id="current-score">1</span>
            </button>
          </div>
        </div>
      </section>



      <!-- score part -->
      <section class="score-section flex justify-center border-2 items-center min-h-screen hidden">
        <div
          class="text-white text-center bg-[#ffffff33] space-y-10 px-10 py-15 rounded-xl"
        >
          <h1 class="text-8xl font-bold">
            Score:
            <span>14</span>
          </h1>
          <button class="btn btn-neutral text-white">Play Again</button>
          <p>Practice will make you pro!</p>
        </div>
      </section>
    </main>

    <script src="scripts/utility.js"></script>
    <script src="scripts/scripts.js"></script>
  </body>
</html>
