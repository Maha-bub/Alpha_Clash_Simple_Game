<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Alpha clash pro</title>
    <!-- daisy ui setup -->
    <link
      href="https://cdn.jsdelivr.net/npm/daisyui@5"
      rel="stylesheet"
      type="text/css"
    />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  </head>

  <body class="poppins-regular">
    <main
      class="bg-[#010313] min-h-screen bg-[url(images/background.png)] bg-no-repeat bg-center"
    >
      <!-- Home section: play  -->
      <section class="home text-white flex justify-center item-center border hidden">
        <div class="flex flex-col items-center gap-y-8">
          <h1 class="text-8xl bold anton-regular uppercase">Alpha Clash Pro</h1>
          <p>Unleash Your Keyboard Kun g Fu: Press "Enter" to Play</p>
          <button class="btn">
            Play Now
          </button>
        </div>
      </section>

      <!-- Playground -->
      <section class="play-ground"></section>

      <!-- score part -->
      <section class="score-section"></section>
    </main>
  </body>
</html>
